<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Android Agent</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#131a23; --panel2:#182230; --line:#243244;
    --text:#e6edf3; --muted:#8b9bb0; --accent:#4c9aff; --accent2:#2f6fd0;
    --ok:#3fb950; --warn:#d29922; --danger:#f85149;
    --radius:14px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none}
  input,textarea{font-family:inherit;font-size:inherit}

  /* ---------- login ---------- */
  #login{display:flex;align-items:center;justify-content:center;height:100dvh;padding:24px}
  .card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);
        border-radius:var(--radius);padding:28px}
  .logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#7b5cff);
        display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px}
  .card h1{margin:0 0 6px;font-size:20px}
  .card p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
  .field{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--line);
         border-radius:10px;color:var(--text);outline:none}
  .field:focus{border-color:var(--accent)}
  .btn{width:100%;margin-top:12px;padding:12px;border-radius:10px;background:var(--accent);
       color:#fff;font-weight:600}
  .btn:hover{background:var(--accent2)}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  .err{margin-top:12px;padding:10px 12px;border-radius:9px;background:rgba(248,81,73,.12);
       border:1px solid rgba(248,81,73,.35);color:#ffb4ae;font-size:13px;display:none}
  .warnbox{margin-top:18px;padding:11px 13px;border-radius:9px;background:rgba(210,153,34,.1);
           border:1px solid rgba(210,153,34,.3);color:#e8c46a;font-size:12.5px}

  /* ---------- app ---------- */
  #app{display:none;flex-direction:column;height:100dvh}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);
         border-bottom:1px solid var(--line);flex-shrink:0}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0}
  .title{font-weight:600;font-size:15px}
  .sub{color:var(--muted);font-size:12px}
  .spacer{flex:1}
  .ghost{padding:7px 12px;border-radius:9px;background:var(--panel2);color:var(--text);
         border:1px solid var(--line);font-size:13px}
  .ghost:hover{border-color:var(--accent)}

  main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .bubble{max-width:min(78%,620px);padding:10px 14px;border-radius:16px;
          white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .me .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:5px}
  .bot .bubble{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:5px}
  .time{font-size:10.5px;color:var(--muted);margin-top:5px;opacity:.75}

  .approval{width:100%;max-width:620px;background:rgba(210,153,34,.09);
            border:1px solid rgba(210,153,34,.4);border-radius:14px;padding:14px}
  .approval h4{margin:0 0 8px;font-size:14px;color:#e8c46a}
  .args{background:rgba(0,0,0,.28);border-radius:8px;padding:9px 11px;margin:9px 0;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .args div{margin:2px 0}
  .args b{color:var(--muted);font-weight:500}
  .approw{display:flex;gap:9px;margin-top:10px}
  .approw button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:#fff}
  .yes{background:var(--ok)} .no{background:var(--danger)}
  .resolved{margin-top:9px;padding:8px 11px;border-radius:8px;background:rgba(0,0,0,.25);
            font-size:13px;color:var(--muted)}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
        background:rgba(76,154,255,.14);border:1px solid rgba(76,154,255,.3);
        font-size:12px;color:#a8cdff}

  footer{padding:11px 14px;background:var(--panel);border-top:1px solid var(--line);flex-shrink:0}
  .composer{display:flex;gap:9px;align-items:flex-end}
  textarea{flex:1;resize:none;max-height:130px;padding:11px 14px;background:var(--bg);
           border:1px solid var(--line);border-radius:12px;color:var(--text);outline:none}
  textarea:focus{border-color:var(--accent)}
  .send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;
        font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .send[disabled]{opacity:.5}
  .hint{margin-top:7px;font-size:11.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}

  /* ---------- media drawer ---------- */
  #media{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:20}
  .drawer{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--panel);
          border-left:1px solid var(--line);display:flex;flex-direction:column}
  .dhead{display:flex;align-items:center;padding:14px;border-bottom:1px solid var(--line);gap:10px}
  .dbody{flex:1;overflow-y:auto;padding:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .tile img{width:100%;height:82px;object-fit:cover;display:block;background:#000}
  .tile .nm{padding:6px 7px;font-size:10.5px;color:var(--muted);word-break:break-all}
  .ficon{height:82px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#0d1319}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:36px 12px}
  .typing{display:inline-flex;gap:4px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,60%,100%{opacity:.3} 30%{opacity:1}}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="logo">🤖</div>
    <h1>Android Agent</h1>
    <p>Enter your access token to control this device.</p>
    <input id="tok" class="field" type="password" placeholder="Access token" autocomplete="current-password">
    <button id="go" class="btn">Sign in</button>
    <div id="lerr" class="err"></div>
    <div class="warnbox">
      This page can use the camera, read messages and place calls. Never share
      the tunnel URL or this token.
    </div>
  </div>
</div>

<div id="app">
  <header>
    <div class="dot"></div>
    <div>
      <div class="title">Android Agent</div>
      <div class="sub" id="sub">connecting…</div>
    </div>
    <div class="spacer"></div>
    <button class="ghost" id="mbtn">Media</button>
    <button class="ghost" id="nbtn">New</button>
    <button class="ghost" id="obtn">Exit</button>
  </header>

  <main id="feed"></main>

  <footer>
    <div class="composer">
      <textarea id="msg" rows="1" placeholder="Ask your device something…"></textarea>
      <button class="send" id="snd">↑</button>
    </div>
    <div class="hint">
      <span id="tools">—</span><span id="sess">—</span><span>Enter to send</span>
    </div>
  </footer>
</div>

<div id="media">
  <div class="drawer">
    <div class="dhead">
      <strong>Captured media</strong><div class="spacer"></div>
      <button class="ghost" id="mclose">Close</button>
    </div>
    <div class="dbody" id="mbody"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const H = {'Content-Type':'application/json','X-Android-Agent':'1'};
let busy = false;

const esc = s => String(s??'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, body, method){
  const r = await fetch(path, {
    method: method || (body ? 'POST' : 'GET'),
    headers: H, credentials:'same-origin',
    body: body ? JSON.stringify(body) : undefined
  });
  let data = {};
  try { data = await r.json(); } catch(e){}
  if (r.status === 401) { show('login'); throw new Error('signed out'); }
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

function show(which){
  $('login').style.display = which==='login' ? 'flex' : 'none';
  $('app').style.display   = which==='app'   ? 'flex' : 'none';
}

/* ---------- auth ---------- */
$('go').onclick = async () => {
  const b = $('go'), e = $('lerr');
  b.disabled = true; b.textContent = 'Signing in…'; e.style.display='none';
  try {
    await api('/api/login', { token: $('tok').value });
    $('tok').value = '';
    show('app'); await refresh(); $('msg').focus();
  } catch (err) {
    e.textContent = err.message; e.style.display = 'block';
  } finally { b.disabled = false; b.textContent = 'Sign in'; }
};
$('tok').onkeydown = ev => { if (ev.key === 'Enter') $('go').click(); };
$('obtn').onclick = async () => { await api('/api/logout', {}); show('login'); };

/* ---------- chat ---------- */
function render(state){
  const feed = $('feed');
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  feed.innerHTML = '';

  if (!state.messages.length){
    feed.innerHTML = '<div class="empty">Ask anything — "how much battery", '
      + '"take a photo", "where am I".</div>';
  }

  for (const m of state.messages){
    const when = new Date(m.at*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

    if (m.role === 'approval'){
      const args = Object.entries(m.arguments||{})
        .map(([k,v]) => `<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join('');
      const foot = m.resolved
        ? `<div class="resolved">${esc(m.resolved)}</div>`
        : `<div class="approw">
             <button class="yes" data-ok="1" data-id="${esc(m.approval_id)}">Approve</button>
             <button class="no"  data-ok="0" data-id="${esc(m.approval_id)}">Deny</button>
           </div>`;
      const d = document.createElement('div');
      d.className = 'row';
      d.innerHTML = `<div class="approval"><h4>⚠ Approval required</h4>
        <div>${esc(m.text)}</div><div class="args">${args}</div>${foot}</div>`;
      feed.appendChild(d);
      continue;
    }

    const mine = m.role === 'user';
    const chips = (m.artifacts||[]).map(a =>
      `<span class="chip">${a.kind==='location'?'📍':a.kind==='photo'?'🖼':a.kind==='recording'?'🎙':'📄'} ${esc(a.name)}</span>`
    ).join('');
    const d = document.createElement('div');
    d.className = 'row ' + (mine ? 'me' : 'bot');
    d.innerHTML = `<div class="bubble">${esc(m.text)}
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      <div class="time">${when}</div></div>`;
    feed.appendChild(d);
  }

  if (busy){
    const d = document.createElement('div');
    d.className = 'row bot';
    d.innerHTML = '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
    feed.appendChild(d);
  }
  if (atBottom || busy) feed.scrollTop = feed.scrollHeight;

  const s = state.session;
  $('tools').textContent = state.tools + ' tools';
  $('sess').textContent = s.active
    ? `session ${s.turns} turns · expires in ${Math.floor(s.expires_in/60)}m`
    : 'new session';
  $('sub').textContent = s.active ? 'connected · remembering context' : 'connected';
}

$('feed').onclick = async ev => {
  const b = ev.target.closest('button[data-id]');
  if (!b) return;
  b.disabled = true;
  try {
    const r = await api('/api/approval', { approval_id: b.dataset.id, approve: b.dataset.ok === '1' });
    render(r.state);
  } catch(e){ alert(e.message); }
};

async function refresh(){ try { render(await api('/api/state')); } catch(e){} }

async function send(){
  const box = $('msg'), text = box.value.trim();
  if (!text || busy) return;
  box.value = ''; box.style.height = 'auto';
  busy = true; $('snd').disabled = true;
  try {
    const r = await api('/api/message', { text });
    busy = false; render(r.state);
  } catch (e){
    busy = false;
    alert(e.message); await refresh();
  } finally { busy = false; $('snd').disabled = false; }
}

$('snd').onclick = send;
$('msg').onkeydown = ev => {
  if (ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); send(); }
};
$('msg').oninput = function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 130) + 'px';
};
$('nbtn').onclick = async () => {
  if (!confirm('Start a new conversation? Current context is cleared.')) return;
  render((await api('/api/new', {})).state);
};

/* ---------- media ---------- */
$('mbtn').onclick = async () => {
  $('media').style.display = 'block';
  const body = $('mbody');
  body.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const d = await api('/api/media');
    if (!d.items.length){ body.innerHTML = '<div class="empty">Nothing captured yet.</div>'; return; }
    body.innerHTML = `<div style="font-size:11.5px;color:var(--muted);margin-bottom:11px;
      word-break:break-all">${esc(d.root)}</div><div class="grid">` +
      d.items.map(i => {
        const url = '/api/media/file?name=' + encodeURIComponent(i.name);
        const head = i.kind === 'photo' || i.kind === 'screenshot'
          ? `<img loading="lazy" src="${url}" alt="">`
          : `<div class="ficon">🎙</div>`;
        return `<a class="tile" href="${url}" target="_blank" rel="noopener"
                   style="text-decoration:none;display:block">${head}
                <div class="nm">${esc(i.name)}</div></a>`;
      }).join('') + '</div>';
  } catch(e){ body.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
};
$('mclose').onclick = () => { $('media').style.display = 'none'; };
$('media').onclick = ev => { if (ev.target.id === 'media') $('media').style.display='none'; };

/* ---------- boot ---------- */
(async () => {
  try {
    const p = await fetch('/api/ping', {credentials:'same-origin'}).then(r => r.json());
    if (p.authenticated){ show('app'); await refresh(); }
    else show('login');
  } catch(e){ show('login'); }
  setInterval(() => { if ($('app').style.display === 'flex' && !busy) refresh(); }, 5000);
})();
</script>
</body>
</html>
