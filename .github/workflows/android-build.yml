# Builds the companion APK on GitHub's runners. No local Android toolchain
# is needed: the ubuntu runner image already ships the Android SDK.
#
# Copy this file to .github/workflows/android-build.yml in the repository.
# Then: Actions -> Build companion APK -> Run workflow, and download the
# "companion-debug-apk" artifact when it finishes.

name: Build companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'companion/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    # Pinned rather than ubuntu-latest: the latest label is rolling over to
    # Ubuntu 26.04 and a pinned image keeps this reproducible.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Deliberately NOT using android-actions/setup-android: it invokes
      # "sdkmanager tools", a package that no longer exists, and fails
      # before Gradle even starts. The runner image already provides the
      # SDK with ANDROID_HOME set, which is all the build needs.
      - name: Confirm the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools" || test -d "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > companion/local.properties

      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Generating the wrapper here pins the Gradle version without
      # committing a binary jar to the repository.
      - name: Generate the Gradle wrapper
        working-directory: companion
        run: gradle wrapper --gradle-version 8.7

      - name: Build the debug APK
        working-directory: companion
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: companion-debug-apk
          path: companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
